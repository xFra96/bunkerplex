<div id="intro" aria-hidden="true"><div class="intro-word"><svg class="intro-mark" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1a7f45"/><path d="M25 18l22 14-22 14z" fill="#ffffff"/></svg><span><b>Bunker</b>Plex</span></div></div>
<script>
/* Apertura: il nome compare e lascia il posto alla Home. Una volta per sessione,
   mai sui dispositivi lenti o con le animazioni ridotte. */
(function () {
  var el = document.getElementById('intro');
  var skipIt = false;
  try {
    var prefs = JSON.parse(localStorage.getItem('fpDevice')) || {};
    skipIt = sessionStorage.getItem('fp-intro') === '1' || prefs.anim === 'lite' || (prefs.anim !== 'full' && prefs.slow);
    sessionStorage.setItem('fp-intro', '1');
  } catch (e) {}
  if (skipIt) { el.parentNode.removeChild(el); return; }
  var done = false;
  function end() {
    if (done) return; done = true;
    el.className = 'out';
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
    window.removeEventListener('keydown', skip, true);
    window.removeEventListener('click', skip, true);
  }
  function skip(e) { e.stopPropagation(); e.preventDefault(); end(); }
  window.addEventListener('keydown', skip, true);
  window.addEventListener('click', skip, true);
  setTimeout(end, 1500);
})();
</script>
