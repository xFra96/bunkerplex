<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BunkerPlex</title>
<style>
  * { box-sizing: border-box; }
  html { font-size: 14px; font-size: clamp(14px, 1.5vw, 40px); }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #060a07; color: #f2f5f2; font-family: Roboto, "Segoe UI", sans-serif; }
  .box { width: 40rem; max-width: 92vw; text-align: center; }
  .logo { font-size: 2.6rem; font-weight: 400; letter-spacing: -.02em; margin-bottom: .4rem; }
  .logo b { font-weight: 800; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 1.6rem 0 .6rem; }
  p { color: #9fada3; line-height: 1.6; margin: 0 0 1.2rem; font-size: 1.05rem; }
  p b { color: #f2f5f2; }
  .err { color: #e0a030; min-height: 1.6rem; }
  input { width: 100%; padding: .9rem 1.2rem; font: inherit; font-size: 1.3rem; text-align: center; color: #f2f5f2;
          background: #0e1510; border: 2px solid #17211a; border-radius: .4rem; outline: none; }
  input:focus { border-color: #f2f5f2; background: #17211a; }
  .row { display: flex; justify-content: center; margin-top: 1.2rem; }
  button { font: inherit; font-weight: 700; font-size: 1.1rem; padding: .8rem 1.8rem; margin: 0 .5rem; border: 0;
           border-radius: .4rem; background: #ffffff24; color: #f2f5f2; outline: none; }
  button.primary { background: #1a7f45; color: #ffffff; }
  button:focus, button.primary:focus { background: #f2f5f2; color: #060a07; transform: scale(1.05); }
  .spin { width: 3rem; height: 3rem; margin: 1.5rem auto; border: .3rem solid #17211a; border-top-color: #4cbf7f;
          border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="box">
  <div class="logo"><b>Bunker</b>Plex</div>

  <div id="searching">
    <div class="spin"></div>
    <h1 id="stitle">Cerco il server sulla rete di casa…</h1>
    <p>Il PC con BunkerPlex deve essere acceso e collegato alla stessa rete della TV.</p>
  </div>

  <div id="manual" hidden>
    <h1 id="mtitle">Server non trovato</h1>
    <p>Scrivi l'indirizzo del PC. Lo trovi nella finestra che si apre quando avvii BunkerPlex sul PC
       (ad esempio <b>192.168.1.20</b>).</p>
    <input id="addr" class="f" inputmode="decimal" autocomplete="off" placeholder="192.168.1.20">
    <p class="err" id="err"></p>
    <div class="row">
      <button class="f primary" id="connect">Collega</button>
      <button class="f" id="retry">Cerca di nuovo</button>
    </div>
    <div class="row"><button class="f" id="remote">Amici e tuoi PC fuori casa</button></div>
    <div class="row"><button class="f" id="central">Entra con l'account</button></div>
    <div class="row"><button class="f" id="appset">Impostazioni dell'app</button></div>
  </div>
</div>
<script>
var app = window.BunkerPlexTV;
var $ = function (id) { return document.getElementById(id); };

function showSearching(text) {
  $('manual').hidden = true;
  $('searching').hidden = false;
  $('stitle').textContent = text || 'Cerco il server sulla rete di casa…';
}
function showManual(title, error) {
  $('searching').hidden = true;
  $('manual').hidden = false;
  $('mtitle').textContent = title;
  $('err').textContent = error || '';
  var saved = app ? (app.lastServer ? app.lastServer() : app.getServer()) : '';
  if (saved && !$('addr').value) $('addr').value = saved.replace(/^https?:\/\//, '').replace(/:32500$/, '');
  $('connect').focus();
}
function search() {
  showSearching();
  if (app) app.discover(); else setTimeout(setupNotFound, 800);
}
function connect() {
  var v = $('addr').value.trim();
  if (!v) { $('err').textContent = 'Scrivi prima l\'indirizzo.'; $('addr').focus(); return; }
  showSearching('Mi collego a ' + v + '…');
  if (app) app.saveServer(v);
}

// Amici e tuoi PC con Tailscale (remote.html): solo l'app sulle TV; sul telefono c'e'
// BunkerPlex con l'account (questa pagina serve solo senza Internet)
var remoteOk = !!(app && app.openRemote && (!app.remoteAllowed || app.remoteAllowed()));
if (!remoteOk) $('remote').parentNode.hidden = true;

// Chiamate dall'app
window.setupFound = function (url) { showSearching('Trovato! ' + url.replace('http://', '')); };
// Niente server in casa: sulla TV l'app propone gli amici e i tuoi PC (remote.html)
window.setupNotFound = function () {
  if (remoteOk) location.replace('remote.html#ask'); else showManual('Server non trovato', '');
};
window.setupError = function (url) {
  showManual('Collegamento non riuscito', 'Nessun BunkerPlex risponde a ' + url.replace('http://', '') + '. Il PC è acceso?');
};

$('connect').addEventListener('click', connect);
$('retry').addEventListener('click', search);
$('remote').addEventListener('click', function () { if (app && app.openRemote) app.openRemote(); });
$('central').addEventListener('click', function () { if (app && app.openCentral) app.openCentral(); });
// Versione, aggiornamento e notifiche dell'app: con qualunque server, o nessuno
$('appset').addEventListener('click', function () { if (app && app.openAppSettings) app.openAppSettings(); });
$('addr').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.keyCode === 13) connect(); });

// Frecce del telecomando tra campo e pulsanti
document.addEventListener('keydown', function (e) {
  var code = e.keyCode, list = Array.prototype.slice.call(document.querySelectorAll('#manual .f'))
    .filter(function (b) { return b.offsetParent !== null; });
  var i = list.indexOf(document.activeElement);
  if ($('manual').hidden || i < 0) return;
  var next = -1;
  if (code === 40) next = i === 0 ? 1 : i;            // giu': dal campo ai pulsanti
  else if (code === 38) next = 0;                      // su: torna al campo
  else if (code === 39 && i > 0) next = Math.min(i + 1, list.length - 1);
  else if (code === 37 && i > 0) next = Math.max(i - 1, 1);
  if (next >= 0) { e.preventDefault(); list[next].focus(); }
});

// Anche quando il server salvato non risponde (es. il PC ha cambiato indirizzo) rifa' la scansione
// da solo; se non trova nulla resta il campo per scrivere l'indirizzo a mano.
var offline = location.hash === '#offline';
if (location.hash === '#manual') {
  showManual('Indirizzo del server', '');
  $('addr').focus();
} else if (offline) {
  window.setupNotFound = function () {
    if (remoteOk) { location.replace('remote.html#ask'); return; }
    showManual('Il server non risponde', 'Controlla che il PC sia acceso e che BunkerPlex sia avviato, oppure scrivi l\'indirizzo. Fuori casa accendi Tailscale su questo dispositivo.');
  };
  showSearching('Il server salvato non risponde, lo cerco sulla rete…');
  if (app) app.discover(); else setupNotFound();
} else {
  search();
}
</script>
</body>
</html>
