# Nome fisso: cosi' la cartella si puo' rinominare o copiare su un altro disco
# senza che Docker la scambi per un'altra installazione.
name: francoplex

services:
  francoplex:
    build: ./server
    image: francoplex-server
    container_name: francoplex
    restart: unless-stopped
    ports:
      - "32500:32500"
      # Porta per gli amici: risponde solo a /api/share/ (vedi «Amici» in README.md)
      - "32501:32501"
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_LANG: ${TMDB_LANG:-it-IT}
      SCAN_INTERVAL_MIN: ${SCAN_INTERVAL_MIN:-30}
      # Impronta dei file con cui e' acceso il server: la scrive "Avvia BunkerPlex.bat"
      # e serve a capire se Docker va ricostruito (vedi strumenti/Impronta.ps1)
      BUNKERPLEX_BUILD: ${BUNKERPLEX_BUILD:-}
    volumes:
      # Il catalogo: la cartella "data" qui accanto.
      - type: bind
        source: ./data
        target: /data
      - ./apk:/apk:ro
      # Tutta la cartella di BunkerPlex: il server parte dai file di ./server e
      # ci scrive gli aggiornamenti scaricati da GitHub (vedi server/updater.py).
      - .:/programma
    # I dischi del PC (C:, G:, ..., anche quelli esterni) vengono collegati in sola lettura sotto /host
    # dal file docker-compose.override.yml, che "Avvia BunkerPlex.bat" riscrive
    # a ogni avvio. Le cartelle dei video si scelgono poi dall'app.
