<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrancoPlex</title>
<style>
  * { box-sizing: border-box; }
  html { font-size: 1.25vw; font-size: clamp(14px, 1.25vw, 34px); }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0b0f1a; color: #eef1f7; font-family: Roboto, "Segoe UI", sans-serif; }
  .box { width: 40rem; max-width: 92vw; text-align: center; }
  .logo { font-size: 2.6rem; font-weight: 300; margin-bottom: .4rem; }
  .logo b { color: #ff6b4a; font-weight: 800; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 1.6rem 0 .6rem; }
  p { color: #98a1b8; line-height: 1.6; margin: 0 0 1.2rem; font-size: 1.05rem; }
  p b { color: #eef1f7; }
  .err { color: #ff6b4a; min-height: 1.6rem; }
  input { width: 100%; padding: .9rem 1.2rem; font: inherit; font-size: 1.3rem; text-align: center; color: #eef1f7;
          background: #1a2236; border: 2px solid #2a3450; border-radius: .7rem; outline: none; }
  input:focus { border-color: #eef1f7; }
  .row { display: flex; justify-content: center; margin-top: 1.2rem; }
  button { font: inherit; font-weight: 700; font-size: 1.1rem; padding: .8rem 1.8rem; margin: 0 .5rem; border: 0;
           border-radius: .6rem; background: #ffffff1c; color: #eef1f7; outline: none; }
  button.primary { background: #ff6b4a; color: #1a0d08; }
  button:focus { background: #eef1f7; color: #0b0f1a; transform: scale(1.07); }
  .spin { width: 3rem; height: 3rem; margin: 1.5rem auto; border: .3rem solid #2a3450; border-top-color: #ff6b4a;
          border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="box">
  <div class="logo"><b>Franco</b>Plex</div>

  <div id="searching">
    <div class="spin"></div>
    <h1 id="stitle">Cerco il server sulla rete di casa…</h1>
    <p>Il PC con FrancoPlex deve essere acceso e collegato alla stessa rete della TV.</p>
  </div>

  <div id="manual" hidden>
    <h1 id="mtitle">Server non trovato</h1>
    <p>Scrivi l'indirizzo del PC. Lo trovi nella finestra che si apre quando avvii FrancoPlex sul PC
       (ad esempio <b>192.168.1.20</b>).</p>
    <input id="addr" class="f" inputmode="decimal" autocomplete="off" placeholder="192.168.1.20">
    <p class="err" id="err"></p>
    <div class="row">
      <button class="f primary" id="connect">Collega</button>
      <button class="f" id="retry">Cerca di nuovo</button>
    </div>
  </div>
</div>
<script>
var app = window.FrancoPlexTV;
var $ = function (id) { return document.getElementById(id); };

function showSearching(text) {
  $('manual').hidden = true;
  $('searching').hidden = false;
  $('stitle').textContent = text || 'Cerco il server sulla rete di casa…';
}
function showManual(title, error) {
  $('searching').hidden = true;
  $('manual').hidden = false;
  $('mtitle').textContent = title;
  $('err').textContent = error || '';
  var saved = app ? app.getServer() : '';
  if (saved && !$('addr').value) $('addr').value = saved.replace(/^https?:\/\//, '').replace(/:32500$/, '');
  $('connect').focus();
}
function search() {
  showSearching();
  if (app) app.discover(); else setTimeout(setupNotFound, 800);
}
function connect() {
  var v = $('addr').value.trim();
  if (!v) { $('err').textContent = 'Scrivi prima l\'indirizzo.'; $('addr').focus(); return; }
  showSearching('Mi collego a ' + v + '…');
  if (app) app.saveServer(v);
}

// Chiamate dall'app
window.setupFound = function (url) { showSearching('Trovato! ' + url.replace('http://', '')); };
window.setupNotFound = function () { showManual('Server non trovato', ''); };
window.setupError = function (url) {
  showManual('Collegamento non riuscito', 'Nessun FrancoPlex risponde a ' + url.replace('http://', '') + '. Il PC è acceso?');
};

$('connect').addEventListener('click', connect);
$('retry').addEventListener('click', search);
$('addr').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.keyCode === 13) connect(); });

// Frecce del telecomando tra campo e pulsanti
document.addEventListener('keydown', function (e) {
  var code = e.keyCode, list = Array.prototype.slice.call(document.querySelectorAll('#manual .f'));
  var i = list.indexOf(document.activeElement);
  if ($('manual').hidden || i < 0) return;
  var next = -1;
  if (code === 40) next = i === 0 ? 1 : i;            // giu': dal campo ai pulsanti
  else if (code === 38) next = 0;                      // su: torna al campo
  else if (code === 39 && i > 0) next = Math.min(i + 1, list.length - 1);
  else if (code === 37 && i > 0) next = Math.max(i - 1, 1);
  if (next >= 0) { e.preventDefault(); list[next].focus(); }
});

// Anche quando il server salvato non risponde (es. il PC ha cambiato indirizzo) rifa' la scansione
// da solo; se non trova nulla resta il campo per scrivere l'indirizzo a mano.
var offline = location.hash === '#offline';
if (offline) {
  window.setupNotFound = function () {
    showManual('Il server non risponde', 'Controlla che il PC sia acceso e che FrancoPlex sia avviato, oppure scrivi l\'indirizzo.');
  };
  showSearching('Il server salvato non risponde, lo cerco sulla rete…');
  if (app) app.discover(); else setupNotFound();
} else {
  search();
}
</script>
</body>
</html>
