# App per iPhone e iPad (ios/): release e versione sue (tag ios-v1.0, ios-v1.1...),
# indipendenti da server e app Android. A ogni push su main che la tocca (ios/,
# la libreria Tailscale android/tsnet o le pagine in comune setup.html e
# remote.html) compila su un Mac di GitHub e pubblica BunkerPlex.ipa.
# L'IPA non e' firmato: lo firma chi lo installa (Sideloadly o AltStore con il
# proprio Apple ID), vedi ios/README.md.

name: Pubblica l'app iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", "android/tsnet/**", "android/app/src/main/assets/setup.html",
            "android/comune/assets/remote.html", ".github/workflows/app-ios.yml"]
  pull_request:
    paths: ["ios/**", "android/tsnet/**", ".github/workflows/app-ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-ios-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Numero di versione
        id: ver
        run: |
          ver=$(python3 .github/versione.py ios)
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "num=${ver#ios-v}" >> "$GITHUB_OUTPUT"
          echo "Versione: $ver"

      - uses: actions/setup-go@v6
        with:
          go-version-file: android/tsnet/go.mod
          cache-dependency-path: android/tsnet/go.sum

      - name: Libreria Tailscale (gomobile)
        run: sh ios/build-bpnet.sh

      - name: Progetto Xcode
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Compila
        run: |
          cd ios
          xcodebuild -project BunkerPlex.xcodeproj -scheme BunkerPlex -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="${{ steps.ver.outputs.num }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BunkerPlex.app Payload/
          zip -qry BunkerPlex.ipa Payload
          ls -l BunkerPlex.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BunkerPlex-ipa
          path: ios/BunkerPlex.ipa

      - name: Pubblica la release
        if: github.event_name != 'pull_request'
        run: |
          ver=${{ steps.ver.outputs.ver }}
          if gh release view "$ver" > /dev/null 2>&1; then
            gh release upload "$ver" ios/BunkerPlex.ipa --clobber
          else
            gh release create "$ver" ios/BunkerPlex.ipa --target "$GITHUB_SHA" --latest=false \
              --title "App iOS ${ver#ios-v}" \
              --notes "App BunkerPlex per iPhone e iPad. Si installa da Windows con Sideloadly (o con AltStore) e il proprio Apple ID: istruzioni in ios/README.md."
          fi
