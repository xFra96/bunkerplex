<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BunkerPlex</title>
<style>
  /* Lo stesso aspetto dell'accesso e della scelta del server (server/static/style.css):
     qui solo quello che serve, perche' questa pagina non carica app.js */
  :root { --bg: #060a07; --surface: #0e1510; --surface2: #17211a; --ink: #f2f5f2; --ink2: #9fada3; --ink3: #77857b;
          --accent: #1a7f45; --accent-text: #4cbf7f; --warn: #e0a030; --ok: #4cbf7f; --r: .4rem; }
  * { box-sizing: border-box; }
  html { font-size: 15px; background: var(--bg); color: var(--ink);
         font-family: "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  html.tv { font-size: clamp(14px, 1.5vw, 40px); }
  body { margin: 0; min-height: 100vh; overflow-x: hidden; background: var(--bg); -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; }
  h1, h2, h3, p { margin: 0; }
  .f { outline: none; }
  [hidden] { display: none !important; }

  /* ---- Pulsanti e campi */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .75rem 1.4rem; border-radius: var(--r);
         background: #ffffff24; font-weight: 700; font-size: 1rem; white-space: nowrap; transition: transform .12s ease-out; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.small { padding: .45rem .9rem; font-size: .9rem; }
  .btn.on { background: var(--accent); color: #fff; }
  .btn:focus { background: var(--ink); color: var(--bg); }
  .field { display: block; width: 100%; padding: .85rem 1.2rem; border-radius: var(--r); background: var(--surface); border: 2px solid var(--surface2);
           font-size: 1.1rem; outline: none; }
  .field::placeholder { color: var(--ink3); }
  .field:focus { border-color: var(--ink); background: var(--surface2); }
  .spin { width: 2.6rem; height: 2.6rem; margin: 1rem auto 1.5rem; border: .3rem solid var(--surface2); border-top-color: var(--accent-text);
          border-radius: 50%; animation: authspin 1s linear infinite; }
  #toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%); background: var(--ink); color: var(--bg);
           padding: .7rem 1.2rem; border-radius: .4rem; font-weight: 600; max-width: 90vw; z-index: 9; }

  /* ---- Accesso e scelta del server (come .auth/.srv in style.css) */
  .auth { min-height: 100vh; min-height: 100dvh; display: flex; padding: 2rem 1rem;
          background: radial-gradient(ellipse 80% 60% at 50% -10%, #1a7f4530, transparent 70%), var(--bg); }
  .authcard { width: 100%; max-width: 26rem; margin: auto; display: flex; flex-direction: column; animation: authin .35s ease-out; }
  .authcard.wide { max-width: 34rem; }
  .authcard.grid { max-width: 64rem; }
  html.tv .authcard.grid { max-width: 92rem; }
  .still .authcard { animation: none; }
  @keyframes authin { from { opacity: 0; transform: translateY(.6rem); } }
  .authbrand { display: flex; align-items: center; justify-content: center; gap: .6rem; margin-bottom: 2.2rem; font-size: 1.6rem; letter-spacing: -.02em; }
  .authbrand svg { width: 2.4rem; height: 2.4rem; }
  .authbrand b { font-weight: 800; }
  .authcard h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -.02em; text-align: center; margin: 0 0 .4rem; }
  .authsub { text-align: center; color: var(--ink2); margin: 0 0 1.8rem; }
  .authsub b { color: var(--ink); }
  .authcard > p { color: var(--ink2); line-height: 1.55; text-align: center; margin: 0 0 1.4rem; }
  .authcard > p b { color: var(--ink); }
  .authcard .field { margin-bottom: .8rem; font-size: 1.08rem; padding: .95rem 1.1rem; border-radius: .6rem; }
  .authcard > p.err { color: var(--warn); min-height: 1.4rem; margin: 0 0 .4rem; }
  .btn.block { display: flex; width: 100%; margin: .4rem 0 0; padding: .95rem 1.5rem; border-radius: .6rem; font-size: 1.08rem; }
  .btn.block:focus { box-shadow: 0 0 0 3px var(--ink); }
  .authlink { display: block; align-self: center; margin-top: 1.1rem; padding: .3rem .6rem; border-radius: var(--r); color: var(--ink2);
              font-weight: 600; font-size: .95rem; text-align: center; }
  .authlink:hover { color: var(--ink); }
  .authlink:focus { background: var(--ink); color: var(--bg); }
  .authlink.back { align-self: flex-start; margin: -1rem 0 1rem; }
  .author { display: flex; align-items: center; gap: .9rem; margin: 1.6rem 0 1.2rem; color: var(--ink3); font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; }
  .author::before, .author::after { content: ""; flex: 1; height: 1px; background: var(--surface2); }
  .gbtn { display: flex; align-items: center; justify-content: center; gap: .75rem; width: 100%; padding: .9rem 1.2rem; border-radius: .6rem;
          background: #fff; color: #1f1f1f; font-weight: 600; font-size: 1.05rem; }
  .gbtn svg { width: 1.3rem; height: 1.3rem; flex: none; }
  .gbtn:focus { box-shadow: 0 0 0 3px var(--accent-text); }
  .tfarem { display: flex; align-items: center; justify-content: center; gap: .55rem; margin: .4rem 0 .8rem; color: var(--ink2); font-size: .92rem; }
  .tfarem input { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
  .gcode { font-size: 2.4rem; font-weight: 800; letter-spacing: .15em; text-align: center; margin: .2rem 0 1rem; }
  .gstatus { display: flex; align-items: center; gap: .6rem; margin: 0 0 1.2rem; color: var(--ink2); font-size: .95rem; line-height: 1.4; }
  .gstatus i { width: .6rem; height: .6rem; border-radius: 50%; flex: none; background: var(--ink3); animation: gpulse 1.6s ease-in-out infinite; }
  .gstatus.ok { color: var(--accent-text); } .gstatus.ok i { background: var(--accent-text); }
  .gstatus.warn { color: #e0a030; } .gstatus.warn i { background: #e0a030; animation: none; }
  @keyframes gpulse { 50% { opacity: .3; } }
  .authcard.gwide { max-width: 48rem; }
  .gtv { display: flex; align-items: stretch; gap: 1.4rem; }
  .gqr, .gtvcode { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .35rem;
                   padding: 1.4rem; border-radius: .9rem; background: var(--surface); text-align: center; }
  .gqr svg { width: 13rem; height: 13rem; border-radius: .5rem; margin-bottom: .6rem; }
  .gqr small, .gtvcode small { color: var(--ink2); }
  .gtvcode b { font-size: 1.2rem; }
  .gtvcode .gcode { margin: .6rem 0; }
  .gor { display: flex; align-items: center; color: var(--ink3); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
  .authico { align-self: center; width: 4rem; height: 4rem; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; margin-bottom: 1.2rem; }
  .authico svg { width: 2rem; height: 2rem; fill: none; stroke: var(--accent-text); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes authspin { to { transform: rotate(360deg); } }
  .authnote { color: var(--ink3); font-size: .9rem; text-align: center; margin-top: 1rem; }
  .authcard h1.small { font-size: 1.4rem; font-weight: 600; }

  .srvfind { margin: 0 0 1.4rem !important; }
  .srvsec { margin-bottom: 1.6rem; }
  .srvsec h2 { display: flex; align-items: center; gap: .5rem; margin: 0 0 .8rem; font-size: .8rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); }
  .srvsec h2 span { padding: .1rem .5rem; border-radius: 1rem; background: var(--surface2); color: var(--ink2); letter-spacing: 0; }
  .srvgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(12.5rem, 1fr)); gap: .9rem; }
  .srv { display: flex; flex-direction: column; align-items: stretch; width: 100%; padding: 0; border-radius: 1rem; overflow: hidden; background: var(--surface);
         border: 2px solid transparent; text-align: left; transition: transform .14s ease-out, background .14s, box-shadow .14s; }
  .srv:hover { background: var(--surface2); }
  .srv:focus { background: var(--ink); color: var(--bg); transform: scale(1.04); box-shadow: 0 .8rem 2rem #000a; }
  .srv.off { opacity: .55; }
  .srvart { position: relative; display: flex; align-items: center; justify-content: center; aspect-ratio: 16 / 9;
            background: radial-gradient(circle at 25% 20%, hsl(var(--h, 150) 70% 45% / .55), transparent 60%), linear-gradient(135deg, hsl(var(--h, 150) 45% 22%), hsl(calc(var(--h, 150) + 40) 40% 12%)); }
  .srvini { font-size: 2.6rem; font-weight: 800; letter-spacing: -.03em; color: #fff; text-shadow: 0 .2rem 1rem #0006; }
  .srvbadge { position: absolute; left: .6rem; bottom: .6rem; width: 2rem; height: 2rem; border-radius: .55rem; background: #0008; display: flex; align-items: center; justify-content: center; }
  .srvbadge svg, .srvart > svg { fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .srvbadge svg { width: 1.15rem; height: 1.15rem; }
  .srvart > svg { width: 2.4rem; height: 2.4rem; }
  .srvtag { position: absolute; right: .6rem; bottom: .6rem; padding: .15rem .55rem; border-radius: 1rem; background: #0008; color: #fff; font-size: .75rem; font-weight: 700; }
  /* Come nell'interfaccia del server: verde = locale (stessa rete), blu = online (via Internet) */
  .srvtag.local { background: #1a7f45e0; }
  .srvtag.net { background: #1d4f8ae0; }
  .srvtxt { display: flex; flex-direction: column; min-width: 0; padding: .75rem .9rem .9rem; }
  .srvtxt b { font-size: 1.05rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srvtxt small { color: var(--ink2); margin-top: .15rem; font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srv:focus .srvtxt small { color: var(--bg); opacity: .75; }
  .srvdot { position: absolute; top: .65rem; right: .65rem; width: .7rem; height: .7rem; border-radius: 50%; background: var(--ink3); box-shadow: 0 0 0 .2rem #0006; }
  .srvdot.live { background: var(--ok); box-shadow: 0 0 0 .25rem #4cbf7f40; }
  .srvdot.wait { background: var(--ink2); animation: srvpulse 1.1s ease-in-out infinite; }
  @keyframes srvpulse { 50% { opacity: .25; } }
  .srv.add { background: transparent; border: 2px dashed var(--surface2); }
  .srv.add .srvart { background: transparent; }
  .srv.add .srvart > svg { stroke: var(--accent-text); }
  .srv.add:focus { background: var(--ink); border-color: var(--ink); }
  .srv.add:focus .srvart > svg { stroke: var(--bg); }
  .srvadd { grid-column: 1 / -1; display: flex; gap: .6rem; align-items: center; }
  .srvadd .field { margin: 0 !important; flex: 1; min-width: 0; }
  .srvadd .btn { margin: 0; border-radius: .6rem; }
  .srvart.img { background-size: cover; background-position: center; }
  .srvart.img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, #0007, transparent 45%); }
  .srvart.img > * { z-index: 1; }
  .srvini.ico { display: flex; }
  .srvini.ico svg { width: 2.8rem; height: 2.8rem; fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 .2rem .6rem #0006); }
  .srvfoot { display: flex; justify-content: center; flex-wrap: wrap; gap: .5rem 1.5rem; }
  .srvfoot .authlink { margin-top: .4rem; }
  .srvreq { display: flex; align-items: center; gap: .8rem; padding: .8rem 1rem; margin-bottom: .9rem; border-radius: .8rem; background: #1a7f4522; color: var(--ink2); }
  .srvreq span { flex: 1; min-width: 0; }
  .srvreq b { color: var(--ink); }
  .srvreq .btn { margin: 0; }
  /* Fuori casa: si vede subito chi risponde da qui e chi si sta ancora cercando */
  .srvstat { display: flex; align-items: center; justify-content: center; gap: .55rem; margin: -.6rem 0 1.6rem; color: var(--ink3); font-size: .88rem; text-align: center; }
  .srvstat i { width: .6rem; height: .6rem; border-radius: 50%; background: var(--ink3); flex: none; }
  .srvstat i.live { background: var(--ok); box-shadow: 0 0 0 .2rem #4cbf7f40; }
  .srvstat i.wait { width: .95rem; height: .95rem; background: none; border: .15rem solid var(--surface2); border-top-color: var(--accent-text); animation: authspin 1s linear infinite; }
  .srvwarn { display: flex; align-items: center; gap: .8rem; padding: .8rem 1rem; margin-bottom: 1.2rem; border-radius: .8rem; background: #e0a0301f; color: var(--ink2); line-height: 1.45; font-size: .92rem; }
  .srvwarn span { flex: 1; min-width: 0; }
  .srvwarn b { display: block; color: var(--warn); }
  .srvwarn .btn { margin: 0; flex: none; }
  .devrow { display: flex; align-items: center; gap: .8rem; width: 100%; padding: .8rem 1rem; margin-bottom: .6rem; border-radius: .8rem; background: var(--surface); text-align: left; }
  .devrow span { flex: 1; min-width: 0; }
  .devrow b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .devrow small { display: block; color: var(--ink2); font-size: .85rem; margin-top: .1rem; }
  .devrow em { font-style: normal; font-weight: 700; color: var(--warn); font-size: .9rem; }
  .devrow .btn { margin: 0; }
  .devrow.pick:focus { background: var(--ink); color: var(--bg); }
  .devrow.pick:focus small, .devrow.pick:focus em { color: var(--bg); }
  @media (max-width: 560px) {
    .srvgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; }
    .srvini { font-size: 2rem; }
    .srvtxt { padding: .6rem .7rem .7rem; }
    .srvtxt b { font-size: .95rem; }
    .srvreq, .srvwarn { flex-wrap: wrap; }
  }
  html.tv .srvgrid { grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 1.1rem; }

  /* ---- Raccolta, film e serie di un server raggiunto da fuori */
  .wrap { max-width: 64rem; margin: 0 auto; padding: 1.2rem 1rem 3rem; }
  .wrap h1 { font-size: 1.4rem; font-weight: 600; margin: 1.2rem 0 .6rem; }
  .wrap p { color: var(--ink2); line-height: 1.55; margin: 0 0 1rem; }
  .logo { font-size: 1.5rem; font-weight: 400; letter-spacing: -.02em; }
  .logo b { font-weight: 800; }
  .top { display: flex; align-items: center; gap: .8rem; margin-bottom: 1rem; }
  .top .logo { margin: 0; flex: 1; }
  .who { color: var(--ink2); font-size: .9rem; }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin-top: 1rem; }
  .row.left { justify-content: flex-start; }
  .wrap .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); gap: .8rem; }
  .card { background: var(--surface); border-radius: .5rem; overflow: hidden; text-align: left; }
  .card .ph { aspect-ratio: 2 / 3; background: var(--surface2) center / cover no-repeat; display: flex; align-items: flex-end; }
  .card .ph span { padding: .4rem; font-size: .8rem; color: var(--ink2); }
  .card b { display: block; padding: .4rem .5rem 0; font-size: .85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card small { display: block; padding: 0 .5rem .5rem; font-size: .75rem; color: var(--ink2); }
  .card:focus, .ep:focus { background: var(--ink); color: var(--bg); }
  .card:focus small, .ep:focus small { color: var(--bg); }
  .hero { position: relative; border-radius: .6rem; overflow: hidden; background: var(--surface) center / cover no-repeat; min-height: 12rem; margin-bottom: 1rem; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, #060a07 5%, #060a0799 60%, #060a0733); }
  .hero div { position: relative; z-index: 1; padding: 6rem 1rem 1rem; }
  .wrap .hero h1 { margin: 0 0 .3rem; font-size: 1.6rem; }
  .meta { color: var(--ink2); font-size: .9rem; }
  .tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin: .6rem 0 .8rem; }
  .ep { display: flex; gap: .8rem; width: 100%; text-align: left; background: var(--surface); border-radius: .5rem; padding: .6rem; margin-bottom: .5rem; align-items: center; }
  .ep i { width: 7rem; flex: none; aspect-ratio: 16 / 9; border-radius: .3rem; background: var(--surface2) center / cover no-repeat; }
  .ep span { min-width: 0; }
  .ep b { display: block; font-weight: 600; }
  .ep small { color: var(--ink2); font-size: .85rem; margin-top: .2rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  /* Col dito il fuoco non si disegna: si vede solo con frecce e telecomando (come body.kb di app.js) */
  body:not(.kb) .srv:focus { background: var(--surface); color: inherit; transform: none; box-shadow: none; }
  body:not(.kb) .srv:focus .srvtxt small { color: var(--ink2); opacity: 1; }
  body:not(.kb) .srv.add:focus { background: transparent; border-color: var(--surface2); }
  body:not(.kb) .srv.add:focus .srvart > svg { stroke: var(--accent-text); }
  body:not(.kb) .btn:focus { background: #ffffff24; color: inherit; box-shadow: none; }
  body:not(.kb) .btn.primary:focus, body:not(.kb) .btn.on:focus { background: var(--accent); color: #fff; }
  body:not(.kb) .authlink:focus { background: none; color: var(--ink2); }
  body:not(.kb) .card:focus, body:not(.kb) .ep:focus, body:not(.kb) .devrow.pick:focus { background: var(--surface); color: inherit; }
  body:not(.kb) .card:focus small, body:not(.kb) .ep:focus small, body:not(.kb) .devrow.pick:focus small { color: var(--ink2); }
  body:not(.kb) .devrow.pick:focus em { color: var(--warn); }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" hidden></div>
<script>
(function () {
'use strict';
var app = window.BunkerPlexTV;
var TV = !!(app && app.isTv && app.isTv());
if (TV) document.documentElement.classList.add('tv');
var root = document.getElementById('app');
var QUALITY = 720;                       // da fuori casa i video arrivano convertiti: la linea di chi condivide e' poca

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(function () { t.hidden = true; }, 3500);
}
window.toastFromApp = toast;

// Tasti o dito: con frecce e telecomando il fuoco si vede, col dito no (TV sempre tasti).
// touched: chi guarda ha gia' fatto qualcosa, gli aggiornamenti in sottofondo non gli spostano il fuoco
var touched = false;
function setKb(on) { document.body.classList.toggle('kb', on); }
setKb(TV);
document.addEventListener('pointerdown', function () { touched = true; if (!TV) setKb(false); }, true);

// ---- Ponte con l'app: le risposte lente tornano in remoteDone(n, ok, testo)
var waiting = {}, seq = 0;
window.remoteDone = function (n, ok, text) {
  var w = waiting[n];
  delete waiting[n];
  if (w) (ok ? w.ok : w.ko)(text);
};
function bridge(fn, args) {
  return new Promise(function (ok, ko) {
    if (!app || !app[fn]) { ko('Questa pagina funziona solo nell\'app BunkerPlex'); return; }
    var n = ++seq;
    waiting[n] = { ok: ok, ko: ko };
    app[fn].apply(app, args.concat([n]));
  });
}
function cloud(method, path, body) {
  return bridge('remoteCloud', [method, path, body ? JSON.stringify(body) : '']).then(JSON.parse, function (t) {
    var e;
    try { e = JSON.parse(t); } catch (x) { e = { detail: t }; }
    if (e.status === 401) { go('login'); }
    var err = new Error(e.detail || 'Servizio account non raggiungibile');
    err.status = e.status || 0;
    throw err;
  });
}
function account() { return app && app.remoteAccount ? app.remoteAccount() : ''; }

// ---- Rete di BunkerPlex (Tailscale dentro l'app): serve per i server fuori da questa rete
var proxy = '', netStart = null;         // proxy = http://127.0.0.1:PORTA/<segreto>
var net = { state: '', error: '', limit: null };   // state: '' | 'starting' | 'ok' | 'limit' | 'error'

// Al limite dei dispositivi dell'account il servizio non fa entrare: err.limit ha
// l'elenco, si chiede all'utente quale togliere e si riprova con quello (replace)
function startNet(replace) {
  if (proxy) return Promise.resolve(proxy);
  if (netStart && !replace) return netStart;
  netStart = bridge('remoteNet', [replace || '']).then(function (b) { proxy = b; netStart = null; return b; }, function (t) {
    netStart = null;
    var e;
    try { e = JSON.parse(t); } catch (x) { e = { detail: t }; }
    var err = new Error(e.detail || 'Tailscale non parte');
    if (e.limit && Array.isArray(e.limit.devices)) err.limit = e.limit;
    throw err;
  });
  return netStart;
}

function pickDevice(lim) {
  return new Promise(function (resolve) {
    var rows = lim.devices.map(function (d) {
      return '<button class="devrow pick f" data-act="pickdev" data-arg="' + esc(d.id) + '"><span><b>' + esc(d.label) + '</b>' +
        '<small>' + (d.kind === 'pc' ? 'PC' : 'App') + ' · ' + (d.online ? 'collegato adesso' : 'spento') + '</small></span><em>Togli</em></button>';
    }).join('');
    pickDevice.done = resolve;
    show(authShell('<h1>Hai già ' + (lim.limit || 4) + ' dispositivi</h1>' +
      '<p class="authsub">nella rete di BunkerPlex</p>' +
      '<p>Per raggiungere i server fuori dalla rete in cui sei serve un posto libero: quale togli per far entrare questo dispositivo?</p>' +
      rows + '<button class="authlink f" data-act="pickdev" data-arg="" data-key="notnow">Non ora</button>', true));
  });
}

function hostOf(url) { return String(url || '').replace(/^https?:\/\//, '').replace(/\/.*$/, ''); }

function withTimeout(ms) {
  var c = window.AbortController ? new AbortController() : null;
  if (c) setTimeout(function () { c.abort(); }, ms);
  return c ? c.signal : undefined;
}

function share(pc, path, opts) {
  opts = opts || {};
  return fetch(pc.base + '/api/share' + path, {
    method: opts.method || 'GET',
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    signal: withTimeout(opts.timeout || 15000)
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) {
        var e = new Error(j.detail || ('Errore ' + r.status));
        e.status = r.status;
        e.offline = !!j.offline;
        throw e;
      }
      return j;
    });
  }, function () {
    var e = new Error('Non raggiungibile');
    e.offline = true;
    throw e;
  });
}

function tokKey(pc) { return 'bp-tok:' + pc.owner + ':' + pc.sid; }

// Si entra nel PC con un biglietto del servizio account (vale una volta): in cambio
// il PC da' un gettone, che poi si riusa finche' vale
function enter(pc) {
  return cloud('POST', '/tickets', { to: pc.owner, sid: pc.sid }).then(function (r) {
    app.remoteToken(pc.host, '');
    return share(pc, '/ticket', { method: 'POST', body: { ticket: r.ticket, to: pc.owner } });
  }).then(function (r) {
    try { localStorage.setItem(tokKey(pc), r.token); } catch (e) { /* niente */ }
    app.remoteToken(pc.host, r.token);
  });
}

// Il PC attraverso la rete di BunkerPlex: pc.net = 'ok' (con le sue raccolte) o 'no'
function loadPc(pc) {
  if (!proxy || !pc.host) { pc.net = 'no'; return Promise.resolve(); }
  pc.base = proxy + '/' + pc.host + '/' + pc.pin;
  var saved = '';
  try { saved = localStorage.getItem(tokKey(pc)) || ''; } catch (e) { /* niente */ }
  if (saved) app.remoteToken(pc.host, saved);
  var first = saved ? share(pc, '/libraries') : Promise.reject({ status: 401 });
  return first.catch(function (e) {
    if (e.offline) throw e;
    return enter(pc).then(function () { return share(pc, '/libraries'); });
  }).then(function (libs) {
    pc.net = 'ok';
    pc.error = '';
    pc.libs = Array.isArray(libs) ? libs : [];
  }, function (e) {
    pc.net = 'no';
    pc.error = e.offline ? '' : e.message;
  });
}

// ---- I server dell'account (tuoi e degli amici) e dove si raggiungono da qui.
// Ogni dispositivo fa da se': mostra quello che raggiunge dalla rete in cui si trova.
// Per ogni server: lan = risponde su questa rete ('wait' | 'ok' | 'no'), net = risponde
// attraverso la rete di BunkerPlex (idem). Prima quelli su questa rete, poi gli altri.
var me = null, friendsList = [], pcs = {}, listedAt = 0, listNote = '';
var adding = false, addName = '', findQ = '';
var lastPick = '', lastLib = '';         // tornando indietro, il fuoco torna dove si era scelto

function listKey() { return 'bp-servers:' + account(); }

function readServers() {
  return cloud('GET', '/servers').then(function (r) {
    try { localStorage.setItem(listKey(), JSON.stringify(r)); } catch (e) { /* niente */ }
    listNote = '';
    useServers(r);
  }, function (e) {
    // Senza servizio account (niente Internet) si usa l'ultimo elenco: i server su
    // questa rete si raggiungono lo stesso
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(listKey()) || 'null'); } catch (x) { /* niente */ }
    if (!saved || e.status === 401) throw e;
    listNote = 'Il servizio account non risponde: questo è l\'ultimo elenco salvato.';
    useServers(saved);
  });
}

function useServers(r) {
  me = r.me || null;
  friendsList = r.friends || [];
  var seen = {};
  var probing = canProbe(), home = homeUrl();
  (r.servers || []).forEach(function (s, i) {
    var owner = s.owner || {};
    var key = (owner.id || 0) + '-' + s.sid;
    seen[key] = 1;
    var pc = pcs[key] || (pcs[key] = { key: key, libs: [], lan: '', net: '' });
    var a = s.addresses || {};
    pc.i = i;
    pc.sid = s.sid;
    pc.owner = owner.id;
    pc.ownerName = owner.username || '';
    pc.self = s.role !== 'friend';
    pc.name = s.name || 'PC';
    pc.pin = s.pin || '';
    pc.host = hostOf(a.remote);
    pc.look = s.look || {};
    pc.cloudOn = s.online;               // true, false o null (server di prima: non si sa)
    // Nella rete di casa: l'indirizzo http dell'app (come cLocalProbe in app.js) e il nome con certificato
    var c = [], m = /^https:\/\/([\d.]+):\d+$/.exec(a.lan || '');
    if (m) c.push('http://' + m[1] + ':32500');
    if (a.secure_lan) c.push(a.secure_lan);
    pc.lanCands = c;
    if (!pc.lan) pc.lan = probing && (c.length || home) ? 'wait' : 'no';
    if (!pc.net) pc.net = pc.host ? 'wait' : 'no';
  });
  Object.keys(pcs).forEach(function (k) { if (k !== 'home' && !seen[k]) delete pcs[k]; });
  listedAt = Date.now();
}

function pcList() { return Object.keys(pcs).map(function (k) { return pcs[k]; }); }

function reach(pc) {
  if (pc.lan === 'ok' && pc.localUrl) return 'local';
  if (pc.net === 'ok') return 'net';
  if (pc.cloudOn !== false && (pc.lan === 'wait' || pc.net === 'wait')) return 'wait';
  return 'off';
}
var RANK = { local: 0, net: 1, wait: 2, off: 3 };
function sorted() {
  return pcList().sort(function (a, b) {
    return RANK[reach(a)] - RANK[reach(b)] || (b.cloudOn === true) - (a.cloudOn === true) || a.i - b.i;
  });
}

// Prove sulla rete in cui si trova il dispositivo: l'app chiede /api/info a ogni
// indirizzo (anche al server di casa scelto a mano) e il server dice chi e' (sid)
var probes = {}, found = {};
function canProbe() { return !!(app && app.remoteProbe); }
function homeUrl() {
  var u = '';
  try { u = app && app.getServer ? String(app.getServer() || '') : ''; } catch (e) { /* niente */ }
  return /^https?:\/\//.test(u) ? u.replace(/\/+$/, '') : '';
}
function probe(url) {
  if (!probes[url]) {
    probes[url] = bridge('remoteProbe', [url]).then(function (t) {
      var info = JSON.parse(t);
      if (info && info.sid && !found[info.sid]) found[info.sid] = url;
      return info;
    }).catch(function () { return null; });
  }
  return probes[url];
}

function probeLocal() {
  probes = {};
  found = {};
  if (!canProbe()) return Promise.resolve();
  var home = homeUrl();
  var jobs = pcList().filter(function (pc) { return pc.key !== 'home'; }).map(function (pc) {
    var list = pc.lanCands.concat(home ? [home] : []);
    if (!list.length) { pc.lan = 'no'; pc.localUrl = ''; return null; }
    return Promise.all(list.map(function (u) {
      return probe(u).then(function () {
        if (found[pc.sid] && pc.localUrl !== found[pc.sid]) { pc.lan = 'ok'; pc.localUrl = found[pc.sid]; redraw(); }
      });
    })).then(function () {
      pc.lan = found[pc.sid] ? 'ok' : 'no';
      pc.localUrl = found[pc.sid] || '';
      redraw();
    });
  });
  // Il server di casa scelto a mano, se risponde e non e' gia' uno dell'account
  if (home) {
    jobs.push(probe(home).then(function (info) {
      var known = info && info.sid && pcList().some(function (p) { return p.key !== 'home' && p.sid === info.sid; });
      if (!info || known) { delete pcs.home; }
      else {
        pcs.home = { key: 'home', i: -1, sid: info.sid || '', self: true, home: true, name: info.name || 'Server di casa',
          look: {}, lanCands: [], lan: 'ok', localUrl: home, net: 'no', host: '', libs: [], cloudOn: true };
      }
      redraw();
    }));
  }
  return Promise.all(jobs);
}

function probeNet(replace) {
  var list = pcList().filter(function (pc) { return pc.host; });
  if (!list.length) return Promise.resolve();
  list.forEach(function (pc) { if (pc.net !== 'ok') pc.net = 'wait'; });
  if (!proxy) net.state = 'starting';
  redraw();
  return startNet(replace).then(function () {
    net.state = 'ok';
    net.error = '';
    net.limit = null;
    return Promise.all(list.map(function (pc) { return loadPc(pc).then(redraw); }));
  }, function (e) {
    net.state = e.limit ? 'limit' : 'error';
    net.error = e.message;
    net.limit = e.limit || null;
    list.forEach(function (pc) { if (pc.net !== 'ok') pc.net = 'no'; });
    redraw();
  });
}

function googleStart() {
  return bridge('remoteGoogleStart', []).then(function (t) {
    var g = JSON.parse(t);
    g.until = Date.now() + ((g.ttl || 600) - 60) * 1000;
    gflow = g;
    listedAt = 0;
    show(googlePage(g));
    setTimeout(function () { googlePoll(g); }, 2000);
    return g;
  });
}

function googlePoll(g) {
  if (gflow !== g) return;
  // Scaduto: codice nuovo, da solo
  if (Date.now() > g.until) { googleStart().catch(function (m) { gStatus(m, 'warn'); }); return; }
  bridge('remoteGooglePoll', [g.poll]).then(function (t) {
    if (gflow !== g) return;
    var r = JSON.parse(t);
    if (!r.done) {
      if (r.note) gStatus('Sul telefono: ' + r.note, 'warn');
      else if (r.seen) gStatus(TV ? 'Codice aperto sul telefono: scegli lì l\'account Google' : 'Scegli l\'account Google nel browser', 'ok');
      else gStatus(TV ? 'In attesa del telefono…' : 'In attesa di Google…', '');
      setTimeout(function () { googlePoll(g); }, 2000);
      return;
    }
    gflow = null;
    go('friends');
  }, function (t) {
    if (gflow !== g) return;
    var e;
    try { e = JSON.parse(t); } catch (x) { e = { detail: t }; }
    if (!e.status) {                                     // rete: si riprova
      gStatus('Rete assente: riprovo…', 'warn');
      setTimeout(function () { googlePoll(g); }, 4000);
      return;
    }
    if (e.status === 404) { googleStart().catch(function (m) { gStatus(m, 'warn'); }); return; }
    gflow = null;
    gStatus(e.detail || 'Accesso non riuscito', 'warn');
  });
}

// Dove si raggiunge un server da qui, in parole
function where(pc, st) {
  if (pc.updating) return 'si aggiorna…';
  if (st === 'local') return 'nella stessa rete';
  if (st === 'net') return 'via Internet';
  if (st === 'wait') return 'controllo…';
  if (pc.cloudOn === false) return 'spento';
  if (net.state === 'limit' && pc.host) return 'serve un posto nella rete';
  return 'non raggiungibile';
}

function statusLine(list) {
  if (!list.length) return '';
  var n = { local: 0, net: 0, wait: 0, off: 0 };
  list.forEach(function (p) { n[reach(p)]++; });
  var ok = n.local + n.net, t;
  if (n.wait) t = '<i class="wait"></i>Controllo quali server rispondono da qui…';
  else if (ok) t = '<i class="live"></i>' + ok + (ok === 1 ? ' raggiungibile' : ' raggiungibili') + ' da qui · ' +
    [n.local ? n.local + (n.local === 1 ? ' locale (stessa rete)' : ' locali (stessa rete)') : '', n.net ? n.net + ' online (via Internet)' : ''].filter(Boolean).join(', ');
  else t = '<i></i>Da qui nessun server risponde';
  return '<div class="srvstat">' + t + '</div>';
}

function netNote() {
  if (net.state === 'limit') {
    return '<div class="srvwarn"><span><b>La rete di BunkerPlex è al completo</b>Il tuo account ha già ' + ((net.limit && net.limit.limit) || 4) +

      '<button class="btn f" data-act="netfree" data-key="netfree">Scegli</button></div>';

  if (net.state === 'error') {
    return '<div class="srvwarn"><span><b>Rete di BunkerPlex non disponibile</b>' + esc(net.error) +
      '. I server su questa rete si aprono lo stesso.</span><button class="btn f" data-act="netretry" data-key="netretry">Riprova</button></div>';
  }
  return '';
}

// Aggiorna un tuo PC da fuori casa: lo permette solo il PC stesso, e solo al suo
// padrone (gli amici non vedono il pulsante, e un PC non tuo risponde di no)
function updateErr(pc, e) {
  if (e.status === 403) return 'Solo il proprietario di ' + pc.name + ' può aggiornarlo';
  if (e.status === 404) return pc.name + ' ha una versione di prima: aggiornalo una volta da casa';
  return e.offline ? pc.name + ' non risponde' : e.message;
}

function updatePc(pc) {
  if (pc.updating) { toast(pc.name + ' si sta aggiornando'); return; }
  toast('Controllo gli aggiornamenti di ' + pc.name + '…');
  share(pc, '/update/check', { method: 'POST', body: {}, timeout: 40000 }).then(function (u) {
    if (!u.enabled) { toast('Su ' + pc.name + ' gli aggiornamenti non sono configurati'); return; }
    if (u.phase === 'pc' || u.phase === 'installing' || u.phase === 'restarting') { watchPc(pc); return; }
    if (u.error) { toast(pc.name + ': ' + u.error); return; }
    if (!u.available) { toast(pc.name + ' è aggiornato' + (u.release ? ' (versione ' + u.release + ')' : '')); return; }
    var what = u.code && u.apk ? ' (programma e app per la TV)' : u.apk ? ' (app per la TV)' : '';
    if (!window.confirm('Su ' + pc.name + ' c\'è un aggiornamento' + what + '. Installarlo adesso? Il server si riaccende da solo: se qualcuno sta guardando, si interrompe.')) return;
    return share(pc, '/update/install', { method: 'POST', body: {}, timeout: 20000 }).then(function () { watchPc(pc); });
  }).catch(function (e) { toast(updateErr(pc, e)); });
}

// Segue l'aggiornamento finche' il PC non torna su (anche 10 minuti se si ricostruisce Docker)
function watchPc(pc) {
  pc.updating = true;
  redraw();
  toast('Aggiorno ' + pc.name + '… torna disponibile in qualche minuto');
  var down = false, tries = 0;
  function done(msg) {
    pc.updating = false;
    toast(msg);
    loadPc(pc).then(redraw);
  }
  function tick() {
    tries++;
    share(pc, '/update', { timeout: 8000 }).then(function (u) {
      if (u.phase === 'restarting') down = true;
      if (u.phase === 'pc' || u.phase === 'installing' || u.phase === 'checking' || u.phase === 'restarting') { setTimeout(tick, 4000); return; }
      if (u.phase === 'host') { done('Aggiornamento scaricato: per completarlo rilancia «Installa BunkerPlex» sul PC'); return; }
      if (u.error) { done('Aggiornamento non riuscito: ' + u.error); return; }
      if (!down && tries < 3) { setTimeout(tick, 4000); return; }
      done(pc.name + ' è aggiornato' + (u.release ? ' (versione ' + u.release + ')' : ''));
    }, function () {
      down = true;
      if (tries > 200) { done(pc.name + ' non risponde ancora: riprova tra poco'); return; }
      setTimeout(tick, 4000);
    });
  }
  setTimeout(tick, 3000);
}

// La scelta del server: subito quello che si sa, poi le prove in sottofondo la ridisegnano
function picker() {
  show(listedAt ? serversPage() : loadingPage('Cerco i tuoi server…'));
  if (listedAt && Date.now() - listedAt < 30000) return;
  refreshAll().then(function () {
    if (onPicker()) show(serversPage(), !!root.querySelector('.srvpicker'));
  }, function (e) {
    if (!onPicker()) return;
    if (root.querySelector('.srvpicker')) toast(e.message); else show(listErrorPage(e));
  });
}

var renderSeq = 0;
function render() {
  var my = ++renderSeq;
  touched = false;
  var r = route();
  var page = r[0] || 'ask';
  // Sulla TV non si scrive la password: si entra dal telefono (il QR dell'app TV)
  if (page === 'login' && TV && app && app.phoneLogin) { app.phoneLogin(); return; }
  if (page === 'login' && TV) { show(tvLinkPage(tflow)); if (!tflow) tvStart(); return; }
  if (page === 'login') { show(loginPage()); var u = document.getElementById('u'); if (u) u.focus(); return; }
  if (!account()) { if (page === 'ask') show(askPage()); else go('login'); return; }
  if (page === 'ask' || page === 'friends') { picker(); return; }
  if (page === 'devices') {
    show(devicesPage());
    loadDevices().then(function () { if (my === renderSeq) show(devicesPage(), true); });
    return;
  }
  // Un server attraverso la rete di BunkerPlex: le raccolte, poi film e serie
  var ready = listedAt ? Promise.resolve() : (show(loadingPage('Cerco i tuoi server…')), readServers());
  ready.then(function () {
    var pc = pcs[r[1]];
    if (!pc) return '';
    if (pc.net !== 'ok') show(loadingPage('Mi collego a ' + pc.name + '…'));
    return startNet().then(function () { return pc.net === 'ok' ? null : loadPc(pc); }).then(function () {
      if (pc.net !== 'ok') throw new Error(pc.error || pc.name + ' non risponde: dev\'essere acceso e collegato a Internet');
      if (page === 'pc') return pcPage(pc);
      if (page === 'lib') return libPage(pc, r[2]);
      if (page === 'movie') return moviePage(pc, r[2]);
      if (page === 'show') return showPage(pc, r[2]);
      return '';
    });
  }).then(function (html) {
    if (my !== renderSeq) return;
    if (html) show(html); else go('friends');
  }).catch(function (e) {
    if (my !== renderSeq) return;
    show(authShell('<h1>Non riesco a collegarmi</h1><p>' + esc(e && e.message ? e.message : e) + '</p>' +
      '<button class="btn primary block f" data-act="again" data-key="again" data-autofocus>Riprova</button>' +
      '<button class="authlink f" data-act="friends" data-key="friends">Tutti i server</button>'));
  });
}

function byKey(key) {
  var k = String(key).replace(/["\\]/g, '\\$&');
  return root.querySelector('[data-key="' + k + '"]') || root.querySelector('[data-arg="' + k + '"]');
}
function focusKey(key) { var el = byKey(key); if (el && (TV || document.body.classList.contains('kb'))) el.focus(); }

// keep = aggiornamento della stessa pagina: niente animazione, stesso scorrimento, e il
// fuoco resta dov'era (o, se nessuno ha ancora toccato niente, va al server migliore)
function show(html, keep) {
  var a = document.activeElement;
  var key = keep && a && a !== document.body && root.contains(a) ? (a.getAttribute('data-key') || a.getAttribute('data-arg')) : null;
  var y = window.pageYOffset;
  root.className = keep ? 'still' : '';
  root.innerHTML = html;
  var el = null;
  if (key && touched) el = byKey(key);
  // (sul telefono un aggiornamento non rimette il fuoco in un campo: riaprirebbe la tastiera)
  if (!el && (!keep || TV)) el = root.querySelector('[data-autofocus],[autofocus]') || (TV ? root.querySelector('.f') : null);
  if (!el && key) el = byKey(key);
  srvMount();
  if (el) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
  window.scrollTo(0, keep ? y : 0);
  // Col telecomando il fuoco dev'essere a schermo (sulla TV la prima card puo' cadere sotto)
  if (el && document.body.classList.contains('kb')) el.scrollIntoView({ block: 'nearest' });
}

// Gli aggiornamenti in sottofondo ridisegnano la pagina che li mostra (raccolti in uno),
// ma non mentre si scrive in un campo: si aspetta che lo si lasci
var redrawT = 0, redrawLater = false;
function redraw() {
  clearTimeout(redrawT);
  redrawT = setTimeout(redrawNow, 120);
}
function redrawNow() {
  var a = document.activeElement;
  if (a && a.tagName === 'INPUT' && root.contains(a)) { redrawLater = true; return; }
  redrawLater = false;
  if (root.querySelector('.srvpicker')) { show(serversPage(), true); return; }
  var h = root.querySelector('[data-pc]');
  var pc = h && pcs[h.getAttribute('data-pc')];
  if (pc && pc.net === 'ok') show(pcPage(pc), true);
}
root.addEventListener('focusout', function () {
  if (redrawLater) setTimeout(function () { if (redrawLater) redrawNow(); }, 0);
});
root.addEventListener('input', function (e) {
  if (e.target.id === 'afname') addName = e.target.value;
});

// ---- Azioni

var acts = {
  friends: function () { go('friends'); },
  ask: function () { go('ask'); },
  retry: function () { app && app.retryHome(); },
  setup: function () { app && app.openSetup(); },
  back: function () { history.back(); },
  again: function () { render(); },
  refresh: function () {
    toast('Aggiorno l\'elenco…');
    refreshAll().then(function () {
      if (onPicker()) show(serversPage(), !!root.querySelector('.srvpicker'));
    }, function (e) { toast(e.message); });
  },
  devices: function () { go('devices'); },
  // Un server: su questa rete si apre per intero, altrimenti attraverso la rete di BunkerPlex
  pick: function (key) {
    var pc = pcs[key];
    if (!pc) return;
    lastPick = key;
    lastLib = '';
    var st = reach(pc);
    if (st === 'local' && app.remoteOpen) { toast('Apro ' + pc.name + '…'); app.remoteOpen(pc.localUrl); return; }
    if (st === 'net' || (st === 'local' && pc.net === 'ok')) { go('pc/' + key); return; }
    if (st === 'wait') { toast('Sto ancora cercando ' + pc.name + ': un attimo'); return; }
    toast(pc.cloudOn === false ? pc.name + ' è spento: dev\'essere acceso per guardarlo'
      : net.state === 'limit' && pc.host ? pc.name + ' è fuori da questa rete: libera un posto nella rete di BunkerPlex'
      : 'Da qui ' + pc.name + ' non risponde: dev\'essere acceso e collegato a Internet');
  },
  noshare: function (name) { toast(name + ' non ha server condivisi accesi: deve accendere la condivisione con gli amici sul suo server'); },
  add: function () {
    adding = true;
    addName = '';
    show(serversPage(), true);
    var i = document.getElementById('afname');
    if (i) { i.focus(); i.scrollIntoView({ block: 'nearest' }); }
  },
  addsend: function () {
    var el = document.getElementById('afname');
    var name = (el ? el.value : addName).trim();
    if (!name) { if (el) el.focus(); return; }
    cloud('POST', '/friends', { username: name }).then(function (r) {
      toast(r.status === 'ok' ? 'Ora tu e ' + r.username + ' siete amici' : 'Richiesta mandata a ' + r.username);
      adding = false;
      addName = '';
      if (document.activeElement) document.activeElement.blur();
      return refreshAll();
    }).then(function () {
      if (!onPicker()) return;
      show(serversPage(), true);
      focusKey('add');
    }, function (e) { toast(e.message); });
  },
  accept: function (id) {
    cloud('POST', '/friends/' + id + '/accept').then(refreshAll).then(redrawNow, function (e) { toast(e.message); });
  },
  unfriend: function (id) {
    cloud('DELETE', '/friends/' + id).then(refreshAll).then(redrawNow, function (e) { toast(e.message); });
  },
  netretry: function () { probeNet(); },
  netfree: function () {
    if (!net.limit) return;
    pickDevice(net.limit).then(function (id) {
      show(serversPage());
      if (id) probeNet(id).then(loadDevices).then(redraw);
    });
  },
  login: function () {
    var u = document.getElementById('u').value.trim(), p = document.getElementById('p').value;
    var err = document.getElementById('lerr');
    if (!u || !p) { err.textContent = 'Scrivi nome utente e password.'; return; }
    err.textContent = 'Entro…';
    bridge('remoteLogin', [u, p]).then(function (t) {
      var res = JSON.parse(t);
      // Verifica in due passaggi: prima il codice dell'app di autenticazione
      if (res.need_2fa) { tfa = { ticket: res.ticket, typed: res.typed || u, user: (res.user && res.user.username) || u }; show(tfaPage()); return; }
      if (res.user && res.user.must_change) {
        err.textContent = 'La password è provvisoria: cambiala prima da BunkerPlex sul PC.';
        return;
      }
      listedAt = 0;
      go('friends');
    }, function (m) { err.textContent = m; });
  },
  tfago: function () {
    var c = (document.getElementById('tfac') || {}).value || '';
    var err = document.getElementById('tfaerr');
    if (!tfa) { go('login'); return; }
    if (!c.trim()) { err.textContent = 'Scrivi il codice dell\'app.'; return; }
    err.textContent = 'Controllo…';
    var rem = !!(document.getElementById('tfarem') || {}).checked;
    bridge('remoteLogin2fa', [tfa.ticket, c.trim(), rem, tfa.typed]).then(function () {
      tfa = null;
      listedAt = 0;
      go('friends');
    }, function (m) {
      err.textContent = m;
      // Scaduto o troppi tentativi: si ricomincia dalla password
      if (!/sbagliato/i.test(m)) { tfa = null; setTimeout(function () { go('login'); }, 1800); }
    });
  },
  tfaback: function () { tfa = null; go('login'); },
  google: function () {
    var err = document.getElementById('lerr');
    if (err) err.textContent = 'Un attimo…';
    googleStart().then(function (g) {
      if (!TV && app.openUrl) app.openUrl(g.url);
    }, function (m) { if (err) err.textContent = m; });
  },
  gopen: function () { if (gflow && app.openUrl) app.openUrl(gflow.url); },
  gback: function () { gflow = null; go('login'); },
  logout: function () {
    app.remoteLogout();
    proxy = '';
    net = { state: '', error: '', limit: null };
    pcs = {};
    listedAt = 0;
    devices = undefined;
    adding = false;
    findQ = '';
    go('login');
  },
  lib: function (arg) { lastLib = arg; go('lib/' + arg); },
  pcupd: function (arg) { var pc = pcs[arg]; if (pc && pc.self) updatePc(pc); },
  pickdev: function (id) {
    var done = pickDevice.done;
    pickDevice.done = null;
    if (done) done(id || '');
  },
  devdel: function (id) {
    if (!window.confirm('Togliere questo dispositivo dalla rete di BunkerPlex?')) return;
    cloud('DELETE', '/tailscale/devices/' + id).then(function () { toast('Dispositivo tolto'); return loadDevices(); })
      .then(function () { if (route()[0] === 'devices') show(devicesPage(), true); }, function (e) { toast(e.message); });
  },
  open: function (arg) { go(arg); },
  play: function (arg) { var a = arg.split('/'); var pc = pcs[a[0]]; if (pc) play(pc, a[1]); },
  season: function (arg) {
    var a = arg.split('/');
    showSeason[a[0] + '/' + a[1]] = +a[2];
    render();
  }
};

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || !acts[el.getAttribute('data-act')]) return;
  e.preventDefault();
  touched = true;
  acts[el.getAttribute('data-act')](el.getAttribute('data-arg'));
});

document.addEventListener('keydown', function (e) {
  var code = e.keyCode;
  if (code === 13 || (code >= 37 && code <= 40)) { touched = true; setKb(true); }
  if (code === 13 && e.target.tagName === 'INPUT') {
    e.preventDefault();
    var id = e.target.id;
    if (id === 'afname') acts.addsend();
    else if (id === 'u') document.getElementById('p').focus();
    else if (id === 'p') acts.login();
    else if (id === 'srvfind') {
      var first = Array.prototype.filter.call(root.querySelectorAll('.srv'), function (b) { return !b.hidden && b.getBoundingClientRect().width; })[0];
      if (first) first.focus();
    }
    return;
  }
  // Frecce del telecomando: si va all'elemento piu' vicino in quella direzione. Di lato
  // conta lo scarto tra i bordi (0 se si sovrappongono), cosi' in una griglia si passa
  // alla card della riga o colonna accanto; a parita', quella allineata a sinistra o in alto
  var dir = { 37: 'l', 38: 'u', 39: 'r', 40: 'd' }[code];
  if (!dir) return;
  var cur = document.activeElement;
  if (cur && cur.tagName === 'INPUT' && (dir === 'l' || dir === 'r')) return;
  var list = Array.prototype.slice.call(root.querySelectorAll('.f'));
  if (!cur || list.indexOf(cur) < 0) { if (list[0]) { list[0].focus(); e.preventDefault(); } return; }
  var a = cur.getBoundingClientRect(), best = null, bestScore = Infinity;
  var side = dir === 'l' || dir === 'r';
  list.forEach(function (el) {
    if (el === cur) return;
    var b = el.getBoundingClientRect();
    if (!b.width) return;
    var dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
    var main = dir === 'l' ? -dx : dir === 'r' ? dx : dir === 'u' ? -dy : dy;
    if (main <= 2) return;
    var gap = side ? Math.max(0, b.top - a.bottom, a.top - b.bottom) : Math.max(0, b.left - a.right, a.left - b.right);
    var align = side ? Math.abs(b.top - a.top) : Math.abs(b.left - a.left);
    var score = main + gap * 2.5 + align * .05;
    if (score < bestScore) { bestScore = score; best = el; }
  });
  if (best) {
    e.preventDefault();
    best.focus();
    best.scrollIntoView({ block: 'nearest' });
  }
});

render();
})();
</script>
