<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrenkPlex</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff6b4a'/%3E%3Cpath d='M25 18l22 14-22 14z' fill='%2307080c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="intro" aria-hidden="true">
  <div class="intro-glow"></div>
  <div class="intro-word"><span class="i-a">FRENK</span><span class="i-b">PLEX</span></div>
  <div class="intro-line"></div>
</div>
<script>
(function () {
  var el = document.getElementById('intro');
  var seen = false;
  try { seen = sessionStorage.getItem('fp-intro') === '1'; } catch (e) {}
  if (seen) { el.remove(); return; }
  try { sessionStorage.setItem('fp-intro', '1'); } catch (e) {}
  document.documentElement.classList.add('intro-on');
  var done = false;
  function end() {
    if (done) return; done = true;
    el.classList.add('out');
    document.documentElement.classList.remove('intro-on');
    setTimeout(function () { el.remove(); }, 700);
    window.removeEventListener('keydown', skip, true);
    window.removeEventListener('click', skip, true);
  }
  function skip(e) { e.stopPropagation(); e.preventDefault(); end(); }
  window.addEventListener('keydown', skip, true);
  window.addEventListener('click', skip, true);
  setTimeout(end, 3600);
})();
</script>
<nav id="rail">
  <a class="brand" href="#/home" tabindex="-1">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#ff6b4a"/><path d="M25 18l22 14-22 14z" fill="#07080c"/></svg>
    <span><b>Frenk</b>Plex</span>
  </a>
  <a class="f railitem" href="#/home" data-key="nav-home">

  </a>
  <a class="f railitem" href="#/search" data-key="nav-search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span>Cerca</span>
  </a>
  <a class="f railitem" href="#/sagas" data-key="nav-sagas">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="3.5" width="11" height="14" rx="1.6"/><path d="M4.5 7.5v11.4c0 .9.7 1.6 1.6 1.6h9.4"/></svg><span>Saghe</span>
  </a>
  <div class="raillabel"><span>Raccolte</span></div>
  <div id="navlibs"></div>

  </a>

  </a>
