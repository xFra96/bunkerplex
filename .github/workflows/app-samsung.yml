# App per le TV Samsung (tizen/): compila e firma BunkerPlex.wgt e lo mette nella
# release fissa «samsung-tv» (sempre la stessa: l'app e' una cornice attorno alla PWA
# centrale, cambia di rado; i contenuti arrivano sempre nuovi dal servizio).
#
# Firma: certificato d'autore di BunkerPlex + distributore generico di Tizen, quello
# che le TV in Modalita' sviluppatore accettano (fino ai modelli 2023 circa). Le TV piu'
# nuove vogliono un certificato Samsung legato alla TV: lo si aggiunge al momento di
# installare (vedi tizen/LEGGIMI.md e strumenti/sviluppo/Installa su TV Samsung.bat).
#
# Gli strumenti Tizen sono quelli dell'immagine Docker di install-jellyfin-tizen, la
# stessa dell'installazione (bloccata a una versione provata). Tizen Studio 5.6 sul
# server di GitHub non legge il certificato d'autore («Invalid file or password»).
#
# Il certificato d'autore deve restare sempre lo stesso, se no la TV non accetta
# l'aggiornamento («Author certificate not match»): sta nei segreti
#   TIZEN_AUTHOR_P12_B64  (il file .p12 in base64)
#   TIZEN_AUTHOR_PASSWORD (la sua password)
# Il certificato vale fino al 2027-01-01, come la «Tizen Developers CA» che lo firma:
# poi va rifatto (vedi tizen/LEGGIMI.md).
#
# Le TV che rifiutano il certificato generico (le piu' nuove) vogliono autore e
# distributore firmati da Samsung, col distributore che elenca le TV (DUID). Il lavoro
# «samsung» li chiede a Samsung (tizen/certificato_samsung.py) e pubblica
# BunkerPlex-samsung-cert.wgt nella stessa release:
#   - il telefono che installa manda il DUID della TV al servizio account;
#   - chi amministra entra una volta nell'account Samsung dal telefono (il gettone
#     dura un po'): il servizio lo tiene e lo passa qui;
#   - ogni 5 minuti (o subito, se il servizio riesce ad avviare questo giro) si chiede
#     al servizio se c'e' una TV nuova (GET /samsung/job, con RELEASE_KEY): se si',
#     certificato nuovo con tutte le TV, app firmata, risultato al servizio
#     (POST /samsung/job). I .p12 li tiene il servizio, cifrati con TIZEN_AUTHOR_PASSWORD.

name: Pubblica l'app per TV Samsung

on:
  push:
    branches: [main]
    paths: ["tizen/**", ".github/workflows/app-samsung.yml"]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: release-samsung
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  TIZEN_IMAGE: ghcr.io/georift/install-jellyfin-tizen@sha256:d872a8b7fdb8f9c52e8181a76d3f320fda585c0e059d65d800d2aadad27f0a66

jobs:
  release:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Compila e firma
        env:
          P12_B64: ${{ secrets.TIZEN_AUTHOR_P12_B64 }}
          P12_PW: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
        run: |
          if [ -z "$P12_B64" ] || [ -z "$P12_PW" ]; then
            echo "::error::Mancano i segreti TIZEN_AUTHOR_P12_B64 e TIZEN_AUTHOR_PASSWORD (il certificato d'autore)."
            exit 1
          fi
          mkdir -p cert out
          echo "$P12_B64" | base64 -d > cert/author.p12
          chmod 755 cert && chmod 644 cert/author.p12 && chmod 777 out    # nel contenitore si e' un altro utente
          docker run --rm -e PW="$P12_PW" -v "$PWD/tizen:/src:ro" -v "$PWD/cert:/cert:ro" -v "$PWD/out:/out" \
            --entrypoint /bin/bash "$TIZEN_IMAGE" -c '
            set -e
            mkdir -p /tmp/b /tmp/o
            cp /src/config.xml /src/index.html /src/main.css /src/main.js /src/icon.png /tmp/b/
            cp /cert/author.p12 /tmp/a.p12
            tizen security-profiles add -n BunkerPlex -a /tmp/a.p12 -p "$PW" > /dev/null
            # le password in chiaro nel profilo: cosi tizen package non le chiede
            prof="$HOME/tizen-studio-data/profile/profiles.xml"
            sed -i "s|password=\"/tmp/a.pwd\"|password=\"$PW\"|; s|password=\"[^\"]*tizen-distributor-signer.pwd\"|password=\"tizenpkcs12passfordsigner\"|g" "$prof"
            tizen build-web -- /tmp/b > /dev/null
            tizen package -t wgt -s BunkerPlex -o /tmp/o -- /tmp/b/.buildResult < /dev/null | grep -v "$PW" || true
            cp /tmp/o/*.wgt /out/BunkerPlex.wgt'
          rm -rf cert
          unzip -l out/BunkerPlex.wgt
          unzip -l out/BunkerPlex.wgt | grep -q author-signature.xml

      - name: Pubblica
        run: |
          ver=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('tizen/config.xml').getroot().get('version'))")
          printf '{"version": "%s", "commit": "%s"}\n' "$ver" "${GITHUB_SHA::7}" > out/BunkerPlex-samsung.json
          {
            echo "**BunkerPlex per TV Samsung** ($ver, ${GITHUB_SHA::7})"
            echo
            echo "BunkerPlex.wgt si installa con la TV in Modalità sviluppatore: vedi tizen/LEGGIMI.md."
            echo "Non serve per usare BunkerPlex su Samsung: basta il browser della TV (Internet)."
          } > notes.md
          if gh release view samsung-tv > /dev/null 2>&1; then
            gh release upload samsung-tv out/BunkerPlex.wgt out/BunkerPlex-samsung.json --clobber
            gh release edit samsung-tv --notes-file notes.md
          else
            git tag -f samsung-tv HEAD
            git push -f origin refs/tags/samsung-tv
            gh release create samsung-tv out/BunkerPlex.wgt out/BunkerPlex-samsung.json \
              --title "BunkerPlex per TV Samsung" --notes-file notes.md --verify-tag --latest=false
          fi

  # L'app firmata Samsung per le TV che la vogliono (vedi sopra)
  samsung:
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
      P12_PW: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Cosa c'e' da fare
        id: job
        run: |
          if [ -z "$RELEASE_KEY" ] || [ -z "$P12_PW" ]; then echo "Mancano RELEASE_KEY o TIZEN_AUTHOR_PASSWORD"; echo "mode=none" >> "$GITHUB_OUTPUT"; exit 0; fi
          url=$(python3 -c "import json; print(json.load(open('server/cloud.json'))['url'].rstrip('/'))")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          umask 077
          if ! curl -fsS -m 30 -H "Authorization: Bearer $RELEASE_KEY" "$url/samsung/job" -o "$RUNNER_TEMP/job.json"; then
            echo "::warning::Servizio account non raggiungibile"; echo "mode=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # issue: TV nuove e gettone Samsung valido; restore: l'app cambia, certificati gia' avuti
          mode=$(python3 - "$RUNNER_TEMP/job.json" <<'EOF'
          import json, os, sys
          j = json.load(open(sys.argv[1]))
          if j.get("need") and j.get("token"):
              print("issue")
          elif os.environ["EVENT"] != "schedule" and (j.get("keys") or {}).get("distributor"):
              print("restore")
          else:
              print("none")
          EOF
          )
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Da fare: $mode"

      - name: Certificati Samsung
        id: cert
        if: steps.job.outputs.mode != 'none'
        env:
          URL: ${{ steps.job.outputs.url }}
          MODE: ${{ steps.job.outputs.mode }}
        run: |
          umask 077
          set +e
          python3 tizen/certificato_samsung.py "$MODE" "$RUNNER_TEMP/job.json" "$RUNNER_TEMP/cert"
          code=$?
          set -e
          if [ "$code" != 0 ]; then
            # Il servizio lo dice a chi amministra (gettone scaduto: serve un nuovo accesso Samsung)
            curl -fsS -m 30 -X POST "$URL/samsung/job" -H "Authorization: Bearer $RELEASE_KEY" \
              -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/cert/result.json" || true
            echo "ok=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Firma con i certificati Samsung
        if: steps.cert.outputs.ok == '1'
        run: |
          mkdir -p out-s
          chmod 777 out-s && chmod 755 "$RUNNER_TEMP/cert" && chmod 644 "$RUNNER_TEMP/cert/"*.p12
          docker run --rm -e PW="$P12_PW" -v "$PWD/tizen:/src:ro" -v "$RUNNER_TEMP/cert:/cert:ro" -v "$PWD/out-s:/out" \
            --entrypoint /bin/bash "$TIZEN_IMAGE" -c '
            set -e
            mkdir -p /tmp/b /tmp/o
            cp /src/config.xml /src/index.html /src/main.css /src/main.js /src/icon.png /tmp/b/
            cp /cert/author.p12 /tmp/a.p12 && cp /cert/distributor.p12 /tmp/d.p12
            tizen security-profiles add -n BPSamsung -a /tmp/a.p12 -p "$PW" -d /tmp/d.p12 -dp "$PW" > /dev/null
            prof="$HOME/tizen-studio-data/profile/profiles.xml"
            sed -i "s|/tmp/a.pwd|$PW|g; s|/tmp/d.pwd|$PW|g" "$prof"
            tizen build-web -- /tmp/b > /dev/null
            tizen package -t wgt -s BPSamsung -o /tmp/o -- /tmp/b/.buildResult < /dev/null | grep -v "$PW" || true
            cp /tmp/o/*.wgt /out/BunkerPlex-samsung-cert.wgt'
          unzip -l out-s/BunkerPlex-samsung-cert.wgt | grep -q author-signature.xml

      - name: Pubblica e avvisa il servizio
        if: steps.cert.outputs.ok == '1'
        env:
          URL: ${{ steps.job.outputs.url }}
        run: |
          umask 077
          ver=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('tizen/config.xml').getroot().get('version'))")
          python3 - "$RUNNER_TEMP/cert/result.json" "$ver" "${GITHUB_SHA::7}" > out-s/BunkerPlex-samsung-cert.json <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(json.dumps({"version": sys.argv[2], "commit": sys.argv[3], "tvs": len(r["listed"]),
                            "until": int(min(r["author_until"], r["distributor_until"]))}))
          EOF
          gh release upload samsung-tv out-s/BunkerPlex-samsung-cert.wgt out-s/BunkerPlex-samsung-cert.json --clobber
          python3 - "$RUNNER_TEMP/cert/result.json" "$ver" > "$RUNNER_TEMP/done.json" <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1]))
          r["version"] = sys.argv[2]
          print(json.dumps(r))
          EOF
          curl -fsS -m 30 -X POST "$URL/samsung/job" -H "Authorization: Bearer $RELEASE_KEY" \
            -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/done.json"
          rm -rf "$RUNNER_TEMP/cert" "$RUNNER_TEMP/job.json" "$RUNNER_TEMP/done.json"
