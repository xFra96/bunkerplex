# Pubblicazione del servizio account (Cloudflare Worker + D1) con wrangler.
#
#   cd cloud
#   npx wrangler login        (una volta: si conferma nel browser)
#   npx wrangler deploy
#
# I segreti (SETUP_KEY, TS_OAUTH_*, GOOGLE_*, BREVO_API_KEY, CF_API_TOKEN...) non
# stanno qui: restano quelli salvati su Cloudflare (npx wrangler secret put NOME).
# keep_vars: le variabili scritte nel pannello di Cloudflare restano (non le
# cancella una pubblicazione da qui).

name = "bunkerplex-account"
# Account Cloudflare di bunkerplex@outlook.it
account_id = "4a8fc3154525d41fd733768c7ea45e18"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false
keep_vars = true

# La PWA: l'interfaccia dei server (server/static), servita dal Worker (vedi
# pwaAsset in worker.js). run_worker_first: decide sempre il Worker (GET / e' anche
# lo stato del servizio per i server).
[assets]
directory = "../server/static"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "bunkerplex"
database_id = "fa7bbd79-1744-4fb1-a8b7-2bd91032ad4a"

# Una volta a settimana: tiene viva la chiave di Brevo (BREVO_CRON in worker.js).
# Ogni ora: avviso ai telefoni se e' uscita un'app Android nuova (announceApp).
[triggers]
crons = ["0 6 * * 1", "17 * * * *"]
