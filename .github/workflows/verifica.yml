# Su ogni pull request che tocca l'app per la TV: controlla che compili, prima
# di unirla in main (dove la compilazione vera pubblica la release).
# Compila la versione di prova (debug), firmata con una chiave usa e getta: non
# serve la chiave vera e non si pubblica niente.

name: Verifica app TV

on:
  pull_request:
    paths: ["android/**", ".github/workflows/verifica.yml"]

permissions:
  contents: read

jobs:
  compila:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic
      - name: Compila
        working-directory: android
        run: gradle --no-daemon assembleDebug
