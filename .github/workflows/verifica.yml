# Su ogni pull request che tocca l'app Android: controlla che compili, prima
# di unirla in main (dove la compilazione vera pubblica la release).
# Compila la versione di prova (debug), firmata con una chiave usa e getta: non
# serve la chiave vera e non si pubblica niente.

name: Verifica app Android

on:
  pull_request:
    paths: ["android/**", ".github/workflows/verifica.yml"]

permissions:
  contents: read

jobs:
  compila:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic
      - name: Compila
        working-directory: android
        run: gradle --no-daemon assembleDebug

      # App del telefono con Firebase (notifiche istantanee), con una configurazione finta:
      # la vera arriva solo nella release dal segreto GOOGLE_SERVICES_JSON
      - name: Compila l'app del telefono con Firebase
        working-directory: android
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": { "project_number": "123456789012", "project_id": "bunkerplex-prova", "storage_bucket": "bunkerplex-prova.appspot.com" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef", "android_client_info": { "package_name": "it.bunkerplex.tv" } },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyA-prova-prova-prova-prova-prova0" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF
          gradle --no-daemon :app:assembleDebug
          grep -rq google_app_id app/build/generated/res/
          rm app/google-services.json
