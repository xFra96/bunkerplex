# Nome fisso: cosi' la cartella si puo' rinominare o copiare su un altro disco
# senza che Docker la scambi per un'altra installazione.
name: bunkerplex

services:
  bunkerplex:
    build: ./server
    image: bunkerplex-server
    container_name: bunkerplex
    restart: unless-stopped
    ports:
      - "32500:32500"
      # Porta per gli amici: risponde solo a /api/share/
      - "32501:32501"
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_LANG: ${TMDB_LANG:-it-IT}
      SCAN_INTERVAL_MIN: ${SCAN_INTERVAL_MIN:-30}
      # Servizio account: vuoto = l'indirizzo scritto in server/cloud.json
      BUNKERPLEX_CLOUD: ${BUNKERPLEX_CLOUD:-}
      # Indirizzo del PC nella rete di casa: lo passa "Installa BunkerPlex" (serve al QR dell'app)
      BUNKERPLEX_LAN_IP: ${BUNKERPLEX_LAN_IP:-}
      # Indirizzo Tailscale del PC, se c'e': e' quello che si da' agli amici
      BUNKERPLEX_TAILSCALE_IP: ${BUNKERPLEX_TAILSCALE_IP:-}
      # Impronta dei file con cui e' acceso il server: la passa "Installa BunkerPlex"
      # e serve a capire se Docker va ricostruito (vedi strumenti/Impronta.ps1)
      BUNKERPLEX_BUILD: ${BUNKERPLEX_BUILD:-}
    volumes:
      # Il catalogo: la cartella "data" qui accanto.
      - type: bind
        source: ./data
        target: /data
      - ./apk:/apk:ro
      # Tutta la cartella di BunkerPlex: il server parte dai file di ./server e
      # ci scrive gli aggiornamenti scaricati da GitHub (vedi server/updater.py).
      - .:/programma
    # I dischi del computer (anche quelli esterni) vengono collegati in sola lettura sotto /host
    # dal file docker-compose.override.yml, che "Installa BunkerPlex" scrive una volta:
    #   - Windows: tutta la cartella dei dischi di Docker Desktop (/mnt/host -> /host/c, /host/g, ...),
    #     con propagazione "rslave": i dischi collegati dopo compaiono da soli (strumenti/Agente.ps1);
    #   - Mac: /Volumes e /Users.
    # Le cartelle dei video si scelgono poi dall'app.
