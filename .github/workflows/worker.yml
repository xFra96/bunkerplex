# A ogni push su main che tocca il servizio account (cloud/) o la PWA che serve
# (server/static/) pubblica il Worker su Cloudflare, da solo.
# Serve il segreto del repo CLOUDFLARE_API_TOKEN (token Cloudflare col modello
# «Edit Cloudflare Workers» sull'account di bunkerplex@outlook.it, piu' D1: Edit).
# Senza segreto il giro si ferma senza errori.

name: Pubblica il Worker

on:
  push:
    branches: [main]
    paths: ["cloud/**", "server/static/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Prove del servizio
        run: node --test cloud/test_worker.mjs
      - name: Pubblica
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: cloud
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Manca il segreto CLOUDFLARE_API_TOKEN: non pubblico"; exit 0; fi
          npx --yes wrangler@4 deploy
